name: collect

on:
  schedule:
    - cron: "17 10 * * *" # 07:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coletar vagas
        run: npm run collect

      - name: Commit de data/ se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças em data/."
          else
            git commit -m "data: coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
