name: collect

# Sem "schedule": o agendador do GitHub atrasa horas e pula dias. Quem dispara este
# workflow todo dia às 07:17 (Brasília) é o Worker em cloudflare/ (ver README).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # sempre a ponta da main, mesmo em reexecução de um run antigo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coletar vagas
        run: npm run collect

      - name: Commit de data/ se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças em data/."
          else
            git commit -m "data: coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
            git push || (git pull --rebase && git push)
          fi
